# 공개 사이트를 짓고 GitHub Pages 로 올린다.
#
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야
# 이 워크플로가 실제로 배포된다.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 관리자 화면에서 연달아 게시해도 안전하다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # 도메인을 붙이기 전에는 github.io 하위 경로로 나가고 색인도 막는다.
        # seoulyouthclub.com 으로 옮기고 나면
        #   SITE_URL: https://seoulyouthclub.com
        #   SITE_INDEX: '1'
        # 로 바꾸고 SITE_BASE 를 지운다. 그것 말고 고칠 곳은 없다.
        env:
          SITE_URL: https://jikchaa.github.io
          SITE_BASE: /yclb/
          SITE_INDEX: '0'
        run: npm run build

      - name: Pages 가 _astro 를 지우지 않게
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
